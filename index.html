function load(){try{const r=localStorage.getItem(STORAGE_KEY);return r?JSON.parse(r):null;}catch{return null;}}
function save(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch{}}

function Dot({k,n,state,onToggle}){
  const bg=state===0?"transparent":state===1?"#00e676":"#ffd600";
  const bd=state===0?"1.5px solid rgba(255,255,255,0.2)":"none";
  return React.createElement("button",{
    onClick:()=>onToggle(k),
    style:{width:38,height:38,borderRadius:8,background:bg,border:bd,
      color:state===0?"rgba(255,255,255,0.3)":"#000",fontSize:14,fontWeight:700,
      cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",
      flexShrink:0,position:"relative",transition:"background 0.1s"}
  },
    state===2&&React.createElement("span",{style:{position:"absolute",top:-3,right:-3,fontSize:7,
      background:"#ffd600",color:"#000",borderRadius:"50%",width:11,height:11,
      display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900}},"2"),
    n
  );
}

function TeamBlock({team,color,collected,onToggle}){
  const ks=tn(team.code);
  const have=ks.filter(k=>(collected[k]||0)>0).length;
  const dup=ks.filter(k=>(collected[k]||0)===2).length;
  const full=have===N;
  return React.createElement("div",{style:{marginBottom:8,padding:"8px 10px",
    background:full?"rgba(0,230,118,0.07)":"rgba(255,255,255,0.03)",
    borderRadius:10,borderLeft:`3px solid ${color}`}},
    React.createElement("div",{style:{display:"flex",alignItems:"center",gap:7,marginBottom:6}},
      React.createElement("span",{style:{fontSize:22}},[team.flag]),
      React.createElement("span",{style:{fontSize:16,fontWeight:700,flex:1}},[team.name]),
      React.createElement("span",{style:{fontSize:13,color:"#aaa",fontWeight:700}},[team.code]),
      dup>0&&React.createElement("span",{style:{fontSize:13,color:"#ffd600",background:"rgba(255,214,0,0.15)",padding:"1px 4px",borderRadius:4}},`x2:${dup}`),
      React.createElement("span",{style:{fontSize:14,opacity:0.5}},`${have}/${N}`),
      full&&React.createElement("span",null,"✅")
    ),
    React.createElement("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},
      Array.from({length:N},(_,i)=>i+1).map(n=>{
        const k=`${team.code}_${n}`;
        return React.createElement(Dot,{key:k,k,n,state:collected[k]||0,onToggle});
      })
    )
  );
}

function exportData(collected){
  const data=JSON.stringify(collected,null,2);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="stickers-wc2026-backup.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData(setCollected){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".json";
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(typeof data!=="object")throw new Error();
        setCollected(data);
        save(data);
        alert("Progress imported successfully! ✅");
      }catch{
        alert("Invalid file. Please use a valid backup file.");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function openPDF(doc){
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  if(isIOS){
    const pdfData=doc.output('datauristring');
    const win=window.open();
    win.document.write(`<html><head><title>Stickers WC2026</title></head><body style="margin:0">
      <iframe src="${pdfData}" style="width:100%;height:100vh;border:none"></iframe></body></html>`);
    win.document.close();
  } else {
    doc.save("stickers-wc2026.pdf");
  }
}

function pdfHeader(doc,W,margin,title,subtitle){
  doc.setFillColor(26,107,60);
  doc.rect(0,0,W,32,"F");
  doc.setFontSize(20);doc.setTextColor(255,214,0);
  doc.text("Stickers World Cup 2026 - PANINI",margin,13);
  doc.setFontSize(13);doc.setTextColor(255,255,255);
  doc.text("by Eric & Dani",margin,23);
  doc.setFontSize(11);doc.setTextColor(220,220,220);
  doc.text(subtitle,W-margin,23,{align:"right"});
  return 40;
}

function gerarPDF(collected){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=210,margin=14;
  const have=ALL_KEYS.filter(k=>(collected[k]||0)>=1).length;
  const dup=ALL_KEYS.filter(k=>(collected[k]||0)===2).length;
  const miss=ALL_KEYS.length-have;
  const pct=Math.round(have/ALL_KEYS.length*100);
  let y=pdfHeader(doc,W,margin,"Full Report",`Have: ${have}  |  Missing: ${miss}  |  Doubles: ${dup}  |  Complete: ${pct}%`);

  const line=()=>{doc.setDrawColor(200,200,200);doc.line(margin,y,W-margin,y);y+=5;};
  const checkPage=()=>{if(y>272){doc.addPage();y=14;}};

  // WFC
  const wfcHave=wfcKeys.filter(k=>(collected[k]||0)>0).map(k=>k.replace("FWC_","FWC "));
  const wfcMiss=wfcKeys.filter(k=>(collected[k]||0)===0).map(k=>k.replace("FWC_","FWC "));
  doc.setFontSize(13);doc.setFont(undefined,"bold");doc.setTextColor(140,100,0);
  doc.text("WFC Special Stickers",margin,y);y+=7;
  doc.setFont(undefined,"normal");
  if(wfcHave.length){
    doc.setFontSize(10);doc.setTextColor(30,120,60);
    const rows=[];for(let i=0;i<wfcHave.length;i+=8)rows.push(wfcHave.slice(i,i+8).join("   "));
    rows.forEach(r=>{checkPage();doc.text("HAVE: "+r,margin+2,y);y+=5.5;});
  }
  if(wfcMiss.length){
    doc.setFontSize(10);doc.setTextColor(180,40,40);
    const rows=[];for(let i=0;i<wfcMiss.length;i+=8)rows.push(wfcMiss.slice(i,i+8).join("   "));
    rows.forEach(r=>{checkPage();doc.text("MISSING: "+r,margin+2,y);y+=5.5;});
  }
  y+=2;line();

  GROUPS.forEach(g=>{
    checkPage();
    const gH=g.teams.reduce((a,t)=>a+tn(t.code).filter(k=>(collected[k]||0)>0).length,0);
    const gT=g.teams.length*N;
    doc.setFontSize(13);doc.setFont(undefined,"bold");doc.setTextColor(50,50,50);
    doc.text(`Group ${g.id}`,margin,y);
    doc.setFont(undefined,"normal");
    doc.setFontSize(10);doc.setTextColor(120,120,120);
    doc.text(`${gH}/${gT}`,W-margin,y,{align:"right"});
    y+=6;

    [...g.teams].sort((a,b)=>a.name.localeCompare(b.name)).forEach(t=>{
      checkPage();
      const nums=Array.from({length:N},(_,i)=>i+1);
      const haveN=nums.filter(n=>(collected[`${t.code}_${n}`]||0)>0);
      const missN=nums.filter(n=>(collected[`${t.code}_${n}`]||0)===0);
      const repN=nums.filter(n=>(collected[`${t.code}_${n}`]||0)===2);

      doc.setFontSize(11);doc.setFont(undefined,"bold");doc.setTextColor(40,40,40);
      doc.text(`${t.name} (${t.code})`,margin+2,y);
      doc.setFont(undefined,"normal");
      doc.setFontSize(10);doc.setTextColor(80,80,80);
      doc.text(`${haveN.length}/${N}`,W-margin,y,{align:"right"});
      y+=5.5;

      if(haveN.length){
        doc.setFontSize(10);doc.setTextColor(30,120,60);
        const rows=[];const line2=[];
        haveN.forEach(n=>{line2.push(`${t.code} ${n}`);if(line2.length===10){rows.push([...line2]);line2.length=0;}});
        if(line2.length)rows.push(line2);
        rows.forEach(r=>{checkPage();doc.text("HAVE: "+r.join("   "),margin+4,y);y+=5;});
      }
      if(missN.length){
        doc.setFontSize(10);doc.setTextColor(180,40,40);
        const rows=[];const line2=[];
        missN.forEach(n=>{line2.push(`${t.code} ${n}`);if(line2.length===10){rows.push([...line2]);line2.length=0;}});
        if(line2.length)rows.push(line2);
        rows.forEach(r=>{checkPage();doc.text("MISSING: "+r.join("   "),margin+4,y);y+=5;});
      }
      if(repN.length){
        doc.setFontSize(10);doc.setTextColor(160,120,0);
        const txt="2x: "+repN.map(n=>`${t.code} ${n}`).join("   ");
        checkPage();doc.text(txt,margin+4,y);y+=5;
      }
      y+=1.5;
    });
    y+=2;line();
  });

  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    doc.setFontSize(8);doc.setTextColor(160,160,160);
    doc.text(`Page ${i} of ${pages} · Generated on ${new Date().toLocaleDateString("en-US")}`,W/2,291,{align:"center"});
  }
  openPDF(doc);
}

function gerarPDFMissing(collected){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=210,margin=14;
  const miss=ALL_KEYS.filter(k=>(collected[k]||0)===0).length;
  let y=pdfHeader(doc,W,margin,"Missing Stickers",`Total missing: ${miss} stickers`);

  const line=()=>{doc.setDrawColor(200,200,200);doc.line(margin,y,W-margin,y);y+=5;};
  const checkPage=()=>{if(y>272){doc.addPage();y=14;}};

  // WFC missing
  const wfcMiss=wfcKeys.filter(k=>(collected[k]||0)===0).map(k=>k.replace("FWC_","FWC "));
  if(wfcMiss.length){
    doc.setFontSize(13);doc.setFont(undefined,"bold");doc.setTextColor(140,100,0);
    doc.text(`WFC Specials — ${wfcMiss.length} missing`,margin,y);y+=7;
    doc.setFont(undefined,"normal");doc.setFontSize(11);doc.setTextColor(180,40,40);
    const rows=[];for(let i=0;i<wfcMiss.length;i+=8)rows.push(wfcMiss.slice(i,i+8).join("   "));
    rows.forEach(r=>{checkPage();doc.text(r,margin+4,y);y+=6;});
    y+=2;line();
  }

  // Teams missing - alphabetical
  const allTeams=GROUPS.flatMap(g=>g.teams.map(t=>({...t,color:g.color,gid:g.id})))
    .sort((a,b)=>a.name.localeCompare(b.name));

  allTeams.forEach(t=>{
    const missN=Array.from({length:N},(_,i)=>i+1).filter(n=>(collected[`${t.code}_${n}`]||0)===0);
    if(!missN.length)return;
    checkPage();

    doc.setFontSize(13);doc.setFont(undefined,"bold");doc.setTextColor(40,40,40);
    doc.text(`${t.name} (${t.code})`,margin,y);
    doc.setFont(undefined,"normal");
    doc.setFontSize(10);doc.setTextColor(180,40,40);
    doc.text(`${missN.length} missing`,W-margin,y,{align:"right"});
    y+=6;

    doc.setFontSize(11);doc.setTextColor(180,40,40);
    const rows=[];const line2=[];
    missN.forEach(n=>{line2.push(`${t.code} ${n}`);if(line2.length===10){rows.push([...line2]);line2.length=0;}});
    if(line2.length)rows.push(line2);
    rows.forEach(r=>{checkPage();doc.text(r.join("   "),margin+4,y);y+=6;});
    y+=2;
  });

  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    doc.setFontSize(8);doc.setTextColor(160,160,160);
    doc.text(`Page ${i} of ${pages} · Missing Stickers Report · ${new Date().toLocaleDateString("en-US")}`,W/2,291,{align:"center"});
  }
  openPDF(doc);
}

function App(){
  const[collected,setCollected]=useState(()=>{const s=load();return s!==null?s:FROM_PHOTOS;});
  const[tab,setTab]=useState("grupos");
  const[open,setOpen]=useState(()=>Object.fromEntries(GROUPS.map(g=>[g.id,true])));
  useEffect(()=>{save(collected);},[collected]);
  const toggle=useCallback(k=>{setCollected(prev=>({...prev,[k]:((prev[k]||0)+1)%3}));},[]);
  const st=useMemo(()=>{
    const have=ALL_KEYS.filter(k=>(collected[k]||0)>=1).length;
    const dup=ALL_KEYS.filter(k=>(collected[k]||0)===2).length;
    return{have,dup,miss:ALL_KEYS.length-have,pct:Math.round(have/ALL_KEYS.length*100)};
  },[collected]);
  const missingList=useMemo(()=>{
    const out=[];
    GROUPS.forEach(g=>g.teams.forEach(t=>{
      const miss=Array.from({length:N},(_,i)=>i+1).filter(n=>(collected[`${t.code}_${n}`]||0)===0);
      if(miss.length)out.push({...t,miss,color:g.color});
    }));
    out.sort((a,b)=>a.name.localeCompare(b.name,"pt"));
    const wm=Array.from({length:WFC_COUNT},(_,i)=>i+1).filter(n=>(collected[`FWC_${n}`]||0)===0);
    if(wm.length)out.push({code:"FWC",name:"FWC Especiais",flag:"⭐",miss:wm,color:"#ffd600",isFwc:true});
    return out;
  },[collected]);
  const wfcHave=wfcKeys.filter(k=>(collected[k]||0)>0).length;

  const e=React.createElement;
  const allTeamsSorted=GROUPS.flatMap(g=>g.teams.map(t=>({...t,color:g.color,groupId:g.id}))).sort((a,b)=>a.name.localeCompare(b.name,"pt"));
  const TABS=[{k:"az",l:"🔤 A-Z"},{k:"grupos",l:"⚽ Grupos"},{k:"wfc",l:`⭐ WFC ${wfcHave}/19`},{k:"faltando",l:`🔍 Faltando ${st.miss}`}];
  const STATS=[{v:st.have,l:"HAVE",c:"#00e676"},{v:st.miss,l:"MISSING",c:"#ff5252"},{v:st.dup,l:"DOUBLES",c:"#ffd600"},{v:st.pct+"%",l:"COMPLETE",c:"#40c4ff"}];

  return e("div",{style:{paddingBottom:40}},
    // header
    e("div",{style:{background:"linear-gradient(135deg,#1a6b3c,#0d4a28)",padding:"18px 16px 14px",textAlign:"center",borderBottom:"3px solid #ffd600"}},
      e("div",{style:{fontSize:28}},["⚽🏆⚽"]),
      e("div",{style:{fontSize:20,fontWeight:900,letterSpacing:3,color:"#ffd600",marginBottom:4}},["by Eric & Dani"]),
      e("h1",{style:{margin:"2px 0 0",fontSize:32,fontWeight:900,letterSpacing:2,textTransform:"uppercase",color:"#ffd600"}},["Stickers World Cup 2026"]),
      e("div",{style:{fontSize:15,opacity:0.7,letterSpacing:1,marginTop:4}},["PANINI · FIFA WORLD CUP™"])
    ),
    // stats
    e("div",{style:{display:"flex",justifyContent:"space-around",padding:"12px 16px",background:"rgba(255,255,255,0.04)",borderBottom:"1px solid rgba(255,255,255,0.07)"}},
      STATS.map(s=>e("div",{key:s.l,style:{textAlign:"center"}},
        e("div",{style:{fontSize:28,fontWeight:900,color:s.c}},[s.v]),
        e("div",{style:{fontSize:13,opacity:0.6,letterSpacing:0.5}},[s.l])
      ))
    ),
    // progress
    e("div",{style:{padding:"10px 16px 0"}},
      e("div",{style:{height:7,background:"rgba(255,255,255,0.1)",borderRadius:4,overflow:"hidden"}},
        e("div",{style:{height:"100%",width:`${st.pct}%`,background:"linear-gradient(90deg,#1a6b3c,#00e676)",borderRadius:4}})
      ),
      e("div",{style:{fontSize:10,opacity:0.4,marginTop:3,textAlign:"center"}},[`${st.have} of ${ALL_KEYS.length} · 1 tap=have · 2=double · 3=clear`])
    ),
    // tabs — 2 rows
    e("div",{style:{margin:"12px 16px 0",display:"flex",flexDirection:"column",gap:6}},
      e("div",{style:{display:"flex",borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.12)"}},
        [{k:"az",l:"🔤 A-Z"},{k:"grupos",l:"⚽ Groups"}].map(t=>e("button",{key:t.k,onClick:()=>setTab(t.k),
          style:{flex:1,padding:"11px 4px",background:tab===t.k?"#1a6b3c":"transparent",
            color:"#fff",border:"none",fontSize:15,fontWeight:700,letterSpacing:0.3,cursor:"pointer"}},[t.l]))
      ),
      e("div",{style:{display:"flex",borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.12)"}},
        [{k:"wfc",l:`⭐ WFC ${wfcHave}/19`},{k:"faltando",l:`🔍 Missing ${st.miss}`}].map(t=>e("button",{key:t.k,onClick:()=>setTab(t.k),
          style:{flex:1,padding:"11px 4px",background:tab===t.k?"#1a6b3c":"transparent",
            color:"#fff",border:"none",fontSize:15,fontWeight:700,letterSpacing:0.3,cursor:"pointer"}},[t.l]))
      )
    ),
    // content
    e("div",{style:{padding:"12px 16px 0"}},
      // A-Z tab
      tab==="az"&&e("div",null,
        allTeamsSorted.map(t=>e(TeamBlock,{key:t.code,team:t,color:t.color,collected,onToggle:toggle}))
      ),
      // Grupos tab
      tab==="grupos"&&GROUPS.map(g=>{
        const gH=g.teams.reduce((a,t)=>a+tn(t.code).filter(k=>(collected[k]||0)>0).length,0);
        const gT=g.teams.length*N;
        const isOpen=open[g.id];
        return e("div",{key:g.id,style:{marginBottom:10}},
          e("button",{onClick:()=>setOpen(p=>({...p,[g.id]:!p[g.id]})),
            style:{width:"100%",display:"flex",alignItems:"center",gap:8,
              background:"rgba(255,255,255,0.06)",border:"none",borderRadius:10,
              padding:"9px 12px",cursor:"pointer",color:"#fff",marginBottom:isOpen?5:0}},
            e("div",{style:{width:28,height:28,borderRadius:7,background:g.color,display:"flex",
              alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:14,flexShrink:0}},[g.id]),
            e("div",{style:{flex:1}},
              e("div",{style:{height:4,background:"rgba(255,255,255,0.1)",borderRadius:2,overflow:"hidden",marginTop:2}},
                e("div",{style:{height:"100%",width:`${Math.round(gH/gT*100)}%`,background:g.color,borderRadius:2}})
              )
            ),
            e("span",{style:{fontSize:11,opacity:0.55,fontWeight:700}},[`${gH}/${gT}`]),
            e("span",{style:{fontSize:10,opacity:0.4}},[isOpen?"▲":"▼"])
          ),
          isOpen&&[...g.teams].sort((a,b)=>a.name.localeCompare(b.name,"pt")).map(t=>e(TeamBlock,{key:t.code,team:t,color:g.color,collected,onToggle:toggle}))
        );
      }),
      tab==="wfc"&&e("div",null,
        e("div",{style:{fontSize:14,fontWeight:700,marginBottom:4}},["⭐ WFC SPECIAL STICKERS"]),
        e("div",{style:{fontSize:11,opacity:0.5,marginBottom:10}},[`19 special stickers · ${wfcHave} collected`]),
        e("div",{style:{background:"rgba(255,214,0,0.08)",borderRadius:12,padding:12,border:"1px solid rgba(255,214,0,0.2)"}},
          e("div",{style:{display:"flex",flexWrap:"wrap",gap:5}},
            wfcKeys.map((k,i)=>{
              const s=collected[k]||0;
              return e("button",{key:k,onClick:()=>toggle(k),style:{
                width:46,height:46,borderRadius:8,
                background:s===0?"transparent":s===1?"#00e676":"#ffd600",
                border:s===0?"2px solid rgba(255,214,0,0.3)":"none",
                color:s===0?"rgba(255,214,0,0.55)":"#000",
                fontSize:10,fontWeight:700,cursor:"pointer",
                display:"flex",flexDirection:"column",alignItems:"center",
                justifyContent:"center",gap:1,position:"relative"}},
                s===2&&e("span",{style:{position:"absolute",top:-3,right:-3,fontSize:7,
                  background:"#ffd600",color:"#000",borderRadius:"50%",width:11,height:11,
                  display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900}},["2"]),
                e("span",{style:{fontSize:15}},["⭐"]),
                e("span",{style:{fontSize:9}},[`FWC ${i+1}`])
              );
            })
          )
        )
      ),
      tab==="faltando"&&e("div",null,
        e("div",{style:{fontSize:14,fontWeight:700,marginBottom:4}},["🔍 MISSING STICKERS"]),
        e("div",{style:{fontSize:11,opacity:0.5,marginBottom:10}},[`${st.miss} stickers left to complete the album`]),
        missingList.length===0
          ?e("div",{style:{textAlign:"center",padding:40,fontSize:20}},["🏆 Album complete!"])
          :missingList.map(t=>e("div",{key:t.code,style:{marginBottom:10,padding:"8px 10px",
              background:t.isFwc?"rgba(255,214,0,0.06)":"rgba(255,80,80,0.05)",
              borderRadius:10,borderLeft:`3px solid ${t.color}`}},
            e("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:5}},
              e("span",{style:{fontSize:18}},[t.flag]),
              e("span",{style:{fontSize:13,fontWeight:700,flex:1}},[t.name]),
              e("span",{style:{fontSize:11,color:t.isFwc?"#ffd600":"#ff5252",fontWeight:700}},[`${t.miss.length} missing`])
            ),
            e("div",{style:{display:"flex",flexWrap:"wrap",gap:4}},
              t.miss.map(n=>e("span",{key:n,style:{
                background:t.isFwc?"rgba(255,214,0,0.18)":"rgba(255,82,82,0.2)",
                color:t.isFwc?"#ffd600":"#ff8a80",
                padding:"3px 8px",borderRadius:5,fontSize:12,fontWeight:700}},
                [t.isFwc?`FWC ${n}`:`${t.code} ${n}`]
              ))
            )
          ))
      )
    ),
    // buttons
    e("div",{style:{padding:"20px 16px 0",display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}},
      e("button",{onClick:()=>gerarPDF(collected),
        style:{background:"linear-gradient(135deg,#1a6b3c,#0d4a28)",border:"none",
          color:"#fff",padding:"10px 22px",borderRadius:8,fontSize:13,fontWeight:700,
          cursor:"pointer",letterSpacing:0.5}},
        ["📄 Full Report"]),
      e("button",{onClick:()=>gerarPDFMissing(collected),
        style:{background:"linear-gradient(135deg,#8b1a1a,#5a0d0d)",border:"none",
          color:"#fff",padding:"10px 22px",borderRadius:8,fontSize:13,fontWeight:700,
          cursor:"pointer",letterSpacing:0.5}},
        ["🔍 Missing Only"]),
      e("button",{onClick:()=>exportData(collected),
        style:{background:"linear-gradient(135deg,#1a3a6b,#0d2847)",border:"none",
          color:"#fff",padding:"10px 22px",borderRadius:8,fontSize:13,fontWeight:700,
          cursor:"pointer",letterSpacing:0.5}},
        ["📤 Export"]),
      e("button",{onClick:()=>importData(setCollected),
        style:{background:"linear-gradient(135deg,#4a1a6b,#2d0d47)",border:"none",
          color:"#fff",padding:"10px 22px",borderRadius:8,fontSize:13,fontWeight:700,
          cursor:"pointer",letterSpacing:0.5}},
        ["📥 Import"]),
      e("button",{onClick:()=>{if(confirm("Clear all progress? This cannot be undone."))setCollected({});},
        style:{background:"transparent",border:"1px solid rgba(255,100,100,0.3)",
          color:"rgba(255,100,100,0.55)",padding:"10px 18px",borderRadius:8,fontSize:12,cursor:"pointer"}},
        ["🗑 Reset"])
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
